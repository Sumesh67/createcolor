  <circle cx="80" cy="112" r="20" fill="white" stroke="#1a1a1a" stroke-width="3.5"/>
  <circle cx="80" cy="112" r="13" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Window bolts -->
  <circle cx="73" cy="105" r="2.5" fill="#1a1a1a"/>
  <circle cx="87" cy="105" r="2.5" fill="#1a1a1a"/>
  <circle cx="73" cy="119" r="2.5" fill="#1a1a1a"/>
  <circle cx="87" cy="119" r="2.5" fill="#1a1a1a"/>
