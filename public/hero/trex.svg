<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240">
  <rect width="200" height="240" fill="white"/>
  <!-- Body -->
  <ellipse cx="105" cy="148" rx="54" ry="50" fill="white" stroke="#1a1a1a" stroke-width="3.5"/>
  <!-- Tail -->
  <path d="M158 162 Q184 158 192 140 Q198 122 182 116" fill="none" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
  <!-- Neck connecting body to head -->
  <path d="M78 102 Q68 88 60 76" fill="none" stroke="#1a1a1a" stroke-width="12" stroke-linecap="round"/>
  <!-- Head -->
  <path d="M28 52 Q26 36 40 32 Q56 26 72 36 Q86 44 86 58 Q90 74 76 84 Q66 92 52 88 Q36 84 28 70 Z" fill="white" stroke="#1a1a1a" stroke-width="3.5"/>
  <!-- Jaw line -->
  <path d="M28 64 Q55 57 86 64" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
  <!-- Teeth top -->
  <path d="M36 64 L34 72 L40 64" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M50 60 L49 68 L56 60" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M64 61 L63 69 L70 62" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M76 64 L74 72 L80 66" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Teeth bottom -->
  <path d="M43 72 L41 64 L48 72" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M59 69 L57 62 L63 69" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Eye -->
  <circle cx="48" cy="50" r="9" fill="white" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="48" cy="50" r="5" fill="#1a1a1a"/>
  <circle cx="46" cy="48" r="2" fill="white"/>
  <!-- Nostril -->
  <ellipse cx="32" cy="40" rx="3.5" ry="2.5" fill="#1a1a1a"/>
  <!-- Tiny arm -->
  <path d="M80 120 Q94 114 98 124" fill="none" stroke="#1a1a1a" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M98 124 L94 130" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M98 124 L102 128" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Left big leg -->
  <path d="M82 192 Q78 208 74 222" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round"/>
  <path d="M74 222 L64 232" stroke="#1a1a1a" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M74 222 L74 232" stroke="#1a1a1a" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M74 222 L84 230" stroke="#1a1a1a" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Right big leg -->
  <path d="M118 194 Q122 210 126 224" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round"/>
  <path d="M126 224 L116 234" stroke="#1a1a1a" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M126 224 L126 234" stroke="#1a1a1a" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M126 224 L136 232" stroke="#1a1a1a" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Back spines -->
  <path d="M92 100 Q90 90 94 86 Q98 90 96 100" fill="white" stroke="#1a1a1a" stroke-width="2.5"/>
  <path d="M104 98 Q102 88 106 84 Q110 88 108 98" fill="white" stroke="#1a1a1a" stroke-width="2.5"/>
  <path d="M116 98 Q114 89 118 86 Q122 89 120 98" fill="white" stroke="#1a1a1a" stroke-width="2.5"/>
  <!-- Belly bumps -->
  <path d="M86 160 Q100 156 114 160 Q100 166 86 160" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M86 170 Q100 166 114 170 Q100 176 86 170" fill="none" stroke="#1a1a1a" stroke-width="2"/>
</svg>
